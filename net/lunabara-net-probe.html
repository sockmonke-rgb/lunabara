<title>Lunabara Net Probe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: the 3D view fills the screen. Title and readout chips sit in the top corners inside the safe area;
     the walk stick appears under the left thumb, the action pad sits under the right thumb, the piece picker and
     the Use button sit just above the pad, and the terminal panel docks at the bottom. Single dark look, like Lunabara. */
  :root{
    color-scheme: dark;
    --sky:#000000;
    --panel:rgba(14,14,16,0.72);
    --panel-solid:rgba(10,10,12,0.95);
    --well:#000000;
    --line:rgba(255,236,200,0.14);
    --text:#ece6da;
    --dim:#9a9488;
    --sun:#ffb347;
    --sun-wash:rgba(255,179,71,0.22);
    --ice:#7fd4e6;
    --ice-wash:rgba(127,212,230,0.2);
    --ok:#7fe0a0;
    --warn:#ff7a59;
    --warn-wash:rgba(255,122,89,0.18);
    --track:rgba(255,255,255,0.08);
    --stick:rgba(236,230,218,0.35);
    --stick-knob:rgba(236,230,218,0.55);
    --stick-fill:rgba(14,14,16,0.25);
    --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --pixel:"Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
  }
  html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--text);font-family:var(--mono);}
  [hidden]{display:none!important;}   /* the Diag, stick and pads set their own display; hidden must still win */
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  #stage{position:fixed;inset:0;touch-action:none;}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;}

  .chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  #top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
       padding-top:calc(env(safe-area-inset-top,0px) + 12px);
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
  #top > *{pointer-events:auto;}
  #title{min-width:0;max-width:62%;}
  #title .name{font-family:var(--pixel);font-size:15px;letter-spacing:.06em;line-height:1.1;}
  #title .sub{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-top:3px;}
  #status{font-size:11px;color:var(--ice);margin-top:5px;line-height:1.35;}
  #status.warn{color:var(--warn);}
  #readout{font-size:11px;line-height:1.5;text-align:right;font-variant-numeric:tabular-nums;min-width:112px;cursor:pointer;}
  #readout b{font-weight:600;}
  #readout .tapdiag{color:var(--dim);font-size:9px;letter-spacing:.06em;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:5px;vertical-align:1px;}
  .dot.live{background:var(--ok);} .dot.down{background:var(--warn);}

  #hint,#buildInfo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);max-width:calc(100% - 230px);
        font-size:11px;line-height:1.45;color:var(--dim);pointer-events:none;transition:opacity .8s;text-shadow:0 1px 3px #000;}
  #hint.gone{opacity:0;}
  #buildInfo{color:var(--text);transition:none;}
  #buildInfo b{font-family:var(--pixel);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--sun);}
  #buildInfo .bad{color:var(--warn);} #buildInfo .snap{color:var(--ice);}

  button{font:600 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text);
         background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;
         -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;touch-action:manipulation;}
  button:focus-visible{outline:2px solid var(--sun);outline-offset:2px;}
  button:disabled{opacity:.4;}
  .pad{position:fixed;width:170px;height:156px;pointer-events:none;
       right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);}
  .pad button{position:absolute;pointer-events:auto;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .pad .big{right:0;bottom:0;width:78px;height:78px;font-size:12px;border-color:var(--sun);color:var(--sun);}
  .pad .big.remove{border-color:var(--warn);color:var(--warn);}
  .pad .sa{right:90px;bottom:8px;width:58px;height:58px;}
  .pad .sb{right:10px;bottom:92px;width:58px;height:58px;}
  .pad .sc{right:90px;bottom:92px;width:58px;height:58px;}
  .pad button.on{background:var(--ice-wash);}
  .pad .big.on{background:var(--sun-wash);}
  .pad svg{width:22px;height:22px;}
  .pad small{font-size:9px;letter-spacing:.04em;}
  #pieces{position:fixed;display:grid;grid-template-columns:repeat(4,62px);gap:6px;
          right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 184px);}
  #pieces button{min-height:38px;padding:6px 2px;font-size:10px;border-radius:8px;letter-spacing:.03em;}
  #pieces button[aria-pressed="true"]{border-color:var(--sun);color:var(--sun);background:var(--sun-wash);}
  #pieces button.del[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-wash);}
  #bUse{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 184px);
        min-width:160px;border-radius:22px;border-color:var(--ice);color:var(--ice);}
  #cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1.5px solid var(--text);
         box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none;}

  #stick{position:fixed;left:0;top:0;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;
         border:1.5px solid var(--stick);background:var(--stick-fill);pointer-events:none;}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--stick-knob);}

  #tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .tag{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;will-change:transform;
       text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8);}
  .tag .n{font-family:var(--pixel);font-size:12px;letter-spacing:.06em;color:var(--sun);}
  .tag .p{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .tag.stale .n{color:var(--dim);} .tag.stale .p{color:var(--warn);}

  /* the spectrometer panel docks at the bottom, over the pads */
  #term{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(560px,calc(100% - 32px));box-sizing:border-box;z-index:6;
        display:flex;flex-direction:column;gap:9px;padding:12px;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;}
  #term .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  #term .hd b{font-family:var(--pixel);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--ice);}
  #term .hd span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
  #term canvas{display:block;width:100%;height:112px;background:var(--well);border:1px solid var(--line);border-radius:8px;}
  #term .bars{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:10px;color:var(--dim);letter-spacing:.04em;}
  #term .bar{height:7px;border-radius:4px;background:var(--track);overflow:hidden;}
  #term .bar i{display:block;height:100%;width:0;background:var(--ice);}
  #term .bar.hold i{background:var(--ok);}
  .knob{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:10px;font-size:11px;}
  .knob label{color:var(--dim);line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .knob label b{display:block;color:var(--text);font-weight:600;letter-spacing:.05em;}
  .knob input{width:100%;height:34px;margin:0;accent-color:var(--sun);touch-action:manipulation;}
  .knob input:disabled{opacity:.5;}
  #term .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--ice);}
  #term .foot.done{color:var(--ok);}
  #term .foot button{min-height:38px;padding:8px 14px;}
  #term .knobs{display:grid;gap:4px;}
  /* phones on their side: a shorter graph and the two dials side by side, so the panel stays clear of the title */
  @media (max-height:500px){
    #term{gap:6px;padding:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);}
    #term canvas{height:64px;}
    #term .knobs{grid-template-columns:1fr 1fr;gap:12px;}
    .knob{grid-template-columns:96px minmax(0,1fr);gap:8px;}
    .knob input{height:30px;}
  }

  #diagShade{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.28);}
  #diag{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:560px;margin:auto;z-index:9;
        background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;
        max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
  #diag textarea{width:100%;height:260px;flex:1 1 auto;min-height:60px;background:var(--well);color:var(--text);border:1px solid var(--line);
        border-radius:8px;font:11px/1.45 var(--mono);padding:8px;box-sizing:border-box;-webkit-user-select:text;user-select:text;resize:none;}
  #diag .row{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--dim);}
  #diag .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  #diag button{min-height:36px;padding:8px 12px;}
  #err{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 300px);font-size:11px;color:var(--warn);text-align:center;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ #hint{transition:none;} }
</style>

<div id="stage"></div>
<div id="tags"></div>
<div id="top">
  <div id="title" class="chip">
    <div class="name">LUNABARA</div>
    <div class="sub" id="buildLine">net probe · co-op test</div>
    <div id="status">Joining the co-op room…</div>
  </div>
  <div id="readout" class="chip" role="button" tabindex="0" aria-label="Open diagnostics">
    <div><b id="fps">--</b> fps · low <span id="fpslow">--</span></div>
    <div><span class="dot" id="dot"></span>players <b id="nplay">1</b></div>
    <div id="pingLine">ping <b id="ping">--</b> ms</div>
    <div class="tapdiag">tap for diag</div>
  </div>
</div>
<div id="hint">Left thumb walks · right thumb looks · wave facing a friend to nuzzle</div>
<div id="buildInfo" hidden></div>
<div id="cross" hidden></div>
<div id="stick" hidden><i id="knob"></i></div>
<button id="bUse" hidden>Use terminal</button>
<div id="walkPad" class="pad">
  <button id="bView" class="sb" aria-label="Switch camera">1P</button>
  <button id="bBuild" class="sc" aria-label="Build">Build</button>
  <button id="bWave" class="sa" aria-label="Wave">Wave</button>
  <button id="bJump" class="big" aria-label="Jump">Jump</button>
</div>
<div id="buildPad" class="pad" hidden>
  <button id="bRotR" class="sb" aria-label="Turn 15 degrees clockwise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4h-4"/></svg><small>15°</small></button>
  <button id="bDone" class="sc" aria-label="Finish building">Done</button>
  <button id="bRotL" class="sa" aria-label="Turn 15 degrees anticlockwise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5"/><path d="M5 4v4h4"/></svg><small>15°</small></button>
  <button id="bPlace" class="big" aria-label="Place piece">Place</button>
</div>
<div id="pieces" role="group" aria-label="Pieces" hidden>
  <button data-k="0" aria-pressed="true">Floor</button>
  <button data-k="1" aria-pressed="false">Wall</button>
  <button data-k="2" aria-pressed="false">Rail</button>
  <button data-k="3" aria-pressed="false">Lamp</button>
  <button data-k="4" aria-pressed="false">Crate</button>
  <button data-k="5" aria-pressed="false">Terminal</button>
  <button data-k="6" aria-pressed="false" class="del">Remove</button>
</div>
<div id="term" role="dialog" aria-label="Spectrometer" hidden>
  <div class="hd"><b>SPECTROMETER</b><span id="termCount">samples logged 0</span></div>
  <canvas id="termCv" width="600" height="224" aria-label="Your signal against the target signal"></canvas>
  <div class="bars"><span>MATCH</span><div class="bar"><i id="termMatch"></i></div><span>HOLD</span><div class="bar hold"><i id="termHold"></i></div></div>
  <div class="knobs">
    <div class="knob"><label for="kF"><b>FREQUENCY</b><span id="kFwho">you</span></label><input id="kF" type="range" min="0" max="1000" value="500"></div>
    <div class="knob"><label for="kA"><b>AMPLITUDE</b><span id="kAwho">you</span></label><input id="kA" type="range" min="0" max="1000" value="500"></div>
  </div>
  <div class="foot" id="termFoot"><span id="termMsg">Match the dashed signal, then hold it.</span><button id="bLeave">Leave</button></div>
</div>
<div id="err" hidden></div>
<div id="diagShade" hidden></div>
<div id="diag" role="dialog" aria-label="Diagnostics" hidden>
  <textarea id="diagText" readonly aria-label="Diagnostics text"></textarea>
  <div class="row">
    <span id="diagMsg">Copy this and paste it back to Claude.</span>
    <span class="btns">
      <button id="bRate">Send 20/s</button>
      <button id="bSmooth">Smooth auto</button>
      <button id="bCopy">Copy</button>
      <button id="bClose">Close</button>
    </span>
  </div>
</div>

<script>
// Error log, started first so it also sees errors from the 3D library while it loads (same as the terrarium probes).
window.__errs={n:0,list:[],last:null,t0:Date.now(),ext:0};
window.__noteErr=function(kind,msg,file,line,col,stack){
  var E=window.__errs;
  if(kind==='page' && String(msg)==='Script error.' && !file){ E.ext++; return; }
  E.n++;
  var x={kind:kind,msg:String(msg||'').slice(0,160),file:String(file||''),line:line||0,col:col||0,s:((Date.now()-E.t0)/1000).toFixed(1),
         stack:String(stack||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).slice(0,3).join(' < ').slice(0,260)};
  if(E.list.length<5) E.list.push(x); else E.last=x;
};
window.addEventListener('error',function(ev){
  var tg=ev.target;
  if(tg && tg!==window && (tg.src||tg.href)){ window.__noteErr('load failed','',tg.src||tg.href,0,0,''); return; }
  var e=ev.error; window.__noteErr('page',ev.message,ev.filename,ev.lineno,ev.colno,e&&e.stack);
},true);
window.addEventListener('unhandledrejection',function(ev){ var r=ev.reason; window.__noteErr('promise',(r&&r.message)||String(r),'',0,0,r&&r.stack); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
window.__lib='cors';
if(!window.THREE){ window.__lib='fallback: plain load'; document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>'); }
</script>
<script>
(function(){
const BUILD='0.3';
const $=id=>document.getElementById(id);
$('buildLine').textContent='net probe '+BUILD+' · co-op test';
const errs=window.__errs;
function noteErr(e,where){ if(window.__noteErr) window.__noteErr(where,(e&&e.message)||String(e),'',0,0,e&&e.stack); }
function errLine(x,i){ const f=x.file?x.file.split('?')[0].split('/').pop()||x.file:'';
  return '  #'+i+' '+x.kind+' at '+x.s+'s: '+(x.msg||'(no message)')+(f?' @ '+f+(x.line?':'+x.line+':'+x.col:''):'')+(x.stack?' | '+x.stack:''); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const r2=v=>Math.round(v*100)/100, r3=v=>Math.round(v*1000)/1000;
const smooth=k=>{ k=clamp(k,0,1); return k*k*(3-2*k); };
function angDiff(a,b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d; }
function pct(a,p){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.min(s.length-1,Math.round(p*(s.length-1)))]; }
function pushCap(a,v,n){ a.push(v); if(a.length>n) a.shift(); }
const f0=v=>v==null?'--':String(Math.round(v));
const finite=(v,lim)=>typeof v==='number' && isFinite(v) && Math.abs(v)<=lim;

// ================================================================ net
// Co-op over the artifact room. Each player's capybara rides in presence (absolute state, a fixed rate);
// moments (wave, nuzzle, build, terminal) and the ping/echo probes go out as events. Everything received is checked before use.
const SUIT_N=4;
const N={state:'starting', t0:Date.now(), useMs:null, room:null, user:null, canWrite:null,
  connected:false, everConnected:false, firstConn:null, downAt:null, drops:0, blips:0, downMs:0, ended:null,
  me:{peer:null,by:null,owner:null,canEdit:null,id:null,name:''},
  peers:new Map(), agents:0, guests:0, myTabs:0, deliveries:0,
  sendHz:20, smooth:'auto', seq:0, lastSend:0, sentTimes:[], bytes:0, presOk:0, presErr:{},
  emitOk:0, emitErr:{}, emitBlocked:{}, emitSkipped:0,
  echo:{k:0,pend:new Map(),rtt:[],lost:0,sent:0,next:0},
  ping:{k:0,pend:new Map(),sent:0,next:0},
  acts:{sent:0,heard:0}, nz:{led:0,joined:0,why:'no mutual wave yet'}, onJoin:null, onLeave:null, onAct:null};
const EXTRAP_MAX=250;

function netStart(){
  const C=window.claude;
  if(!C || typeof C.use!=='function'){ N.state='no-runtime'; B.dbState='no runtime'; return; }
  const t0=Date.now();
  C.use('room').then(room=>{ N.useMs=Date.now()-t0; if(!room){ N.state='unavailable'; return; } N.room=room; N.state='open'; attach(room); },
                     e=>{ N.useMs=Date.now()-t0; N.state='unavailable'; noteErr(e,'room'); });
  C.use('user').then(u=>{ if(!u) return; N.user=u;
    u.me().then(v=>{ N.me.owner=!!v.isOwner; N.me.canEdit=!!v.canEdit; N.me.id=v.id||null; N.me.name=v.name||''; }).catch(()=>{});
    if(typeof u.can==='function') u.can('data.write').then(c=>{ N.canWrite=c; }).catch(()=>{}); }, ()=>{});
  C.use('db').then(db=>{ B.dbMs=Date.now()-t0; if(!db){ B.dbState='unavailable'; return; } B.db=db; B.dbState='open';
    try{ db.collection('pieces').onSnapshot(onSnap,e=>{ B.dbState='stopped ('+((e&&e.code)||'error')+')'; }); }catch(e){ B.dbState='error'; noteErr(e,'db'); } },
    e=>{ B.dbState='unavailable'; noteErr(e,'db'); });
}
function attach(room){
  const term=e=>{ if(e && e.code && !N.ended){ N.ended=e.code; N.connected=false; } };
  room.onConnection(c=>{ const t=Date.now();
    if(c){ if(N.firstConn==null){ N.firstConn=t-N.t0; N.connAt=t; }
      if(N.downAt!=null && N.everConnected){ const d=t-N.downAt; N.downMs+=d; if(d>2000) N.drops++; else N.blips++; }
      N.downAt=null; N.connected=true; N.everConnected=true; }
    else { if(N.connected) N.downAt=t; N.connected=false; } }, term);
  room.onPeers(onPeers, term);
  room.on('echo',m=>{ if(!m.sameTab) return; const k=m.data&&m.data.k, t0=N.echo.pend.get(k);
    if(t0!=null){ N.echo.pend.delete(k); pushCap(N.echo.rtt,Date.now()-t0,40); } }, term);
  room.on('ping',m=>{ if(m.sameTab || m.kind!=='viewer') return; const d=m.data; if(!d || !finite(d.k,1e9)) return; emit('pong',{k:d.k,to:m.peer}); }, term);
  room.on('pong',m=>{ if(m.sameTab) return; const d=m.data; if(!d || d.to!==N.me.peer) return;
    const P=N.ping.pend.get(d.k); if(!P || P.got.has(m.peer)) return; P.got.add(m.peer);
    const R=N.peers.get(m.peer); if(R) pushCap(R.rtt,Date.now()-P.t,40); }, term);
  room.on('act',m=>{ if(m.sameTab) return; const d=m.data; if(!d || typeof d.kind!=='string') return;
    N.acts.heard++; const R=N.peers.get(m.peer); if(R){ R.acts++; if(N.onAct) N.onAct(R,d.kind.slice(0,16)); } }, term);

let simSum=0, simMax=0, drawSum=0, drawMax=0, simMs=0, simMsMax=0, drawMs=0, drawMsMax=0, calls=0, tris=0, hidden=0;
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ hidden++; sendHidden(); } });
window.addEventListener('pagehide',()=>sendHidden());
function statsLine(arr){ const v=arr.map(q=>q.v); return v.length?('avg '+f0(v.reduce((a,b)=>a+b,0)/v.length)+' max '+f0(Math.max(...v))):'--'; }
function diagText(){
  const t=Date.now(), low=fpsHist.length?Math.min(...fpsHist):0, avg=fpsHist.length?fpsHist.reduce((a,b)=>a+b,0)/fpsHist.length:0;
  const echo=N.echo.rtt, conn=N.state==='open'?(N.ended?'ended ('+N.ended+')':N.connected?'live':(N.everConnected?'down':'connecting')):N.state;
  const kc=KINDS.map(()=>0); let raised=0; for(const p of B.list){ kc[p.k]++; if(p.y>0.2) raised++; }
  const terms=B.list.filter(p=>p.k===5);
  const lines=[
    'LUNABARA NET PROBE '+BUILD,
    'fps now/low/avg: '+fpsNow+' / '+low+' / '+avg.toFixed(1)+' (last '+fpsHist.length+'s)  by second: '+fpsHist.join(' '),
    'startup fps by second: '+startHist.join(' ')+'  first touch at '+(firstTouch==null?'--':firstTouch.toFixed(1)+' s'),
    'startup visible/focused by second: '+startVis.join(' '),
    'worst frame ms (last 10s): '+(worstHist.length?Math.max(...worstHist).toFixed(0):'--'),
    'cpu ms per frame: sim '+simMs.toFixed(2)+' (max '+simMsMax.toFixed(1)+')  draw submit '+drawMs.toFixed(2)+' (max '+drawMsMax.toFixed(1)+')',
    'draw calls: '+calls+'  triangles: '+tris+'  pixel ratio: '+DPR+' (device '+(window.devicePixelRatio||1)+')',
    'buffer: '+renderer.domElement.width+'x'+renderer.domElement.height+'  css: '+vw+'x'+vh+'  viewport: '+window.innerWidth+'x'+window.innerHeight+
      (window.visualViewport?'  visual: '+Math.round(visualViewport.width)+'x'+Math.round(visualViewport.height):'')+'  resizes: '+resizes,
    'standalone: '+((navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'yes':'no')+'  hidden: '+hidden+'x  wake lock: '+wakeLock+'  wheel events: '+wheels+'  camera distance '+camDist.toFixed(1)+' m (pulled in '+cam.pulled+' frames)',
    '--- room',
    'room: '+(N.state==='starting'?'waiting for use()':N.state==='no-runtime'?'no window.claude (not opened from the artifact link)':N.state==='unavailable'?'use("room") gave null after '+f0(N.useMs)+' ms':'ready after '+f0(N.useMs)+' ms'),
    'connection: '+conn+'  first connect after '+f0(N.firstConn)+' ms  drops (over 2 s): '+N.drops+'  blips: '+N.blips+'  down total: '+(N.downMs/1000).toFixed(1)+' s',
    'you: peer '+(N.me.peer||'--')+'  owner '+(N.me.owner==null?'?':N.me.owner?'yes':'no')+'  can edit '+(N.me.canEdit==null?'?':N.me.canEdit?'yes':'no')+
      '  data write '+(N.canWrite==null?'?':N.canWrite?'yes':'no')+'  id '+(N.me.id?'yes':'no')+'  name '+(N.me.name?'yes':'no')+'  suit '+SUITS[me.suit].name+(me.suitSet?'':' (deciding)')+' (changed '+suitChanges+'x)  view '+view,
    'players here: '+(N.peers.size+1)+' (you + '+N.peers.size+', live '+[...N.peers.values()].filter(R=>R.live).length+')  your other tabs: '+N.myTabs+'  guests: '+N.guests+'  agents: '+N.agents+'  peer updates: '+N.deliveries,
    'sending: presence target '+N.sendHz+'/s, actual '+(N.sentTimes.filter(x=>x>t-2000).length/2).toFixed(1)+'/s, '+N.bytes+' bytes  ok '+N.presOk+(Object.keys(N.presErr).length?'  errors '+JSON.stringify(N.presErr):''),
    'events: ok '+N.emitOk+'  skipped while offline '+N.emitSkipped+(Object.keys(N.emitErr).length?'  errors '+JSON.stringify(N.emitErr):'  errors none')+
      (Object.keys(N.emitBlocked).length?'  blocked: '+Object.keys(N.emitBlocked).join(','):''),
    'echo (your own event back): last '+f0(echo[echo.length-1])+'  median '+f0(pct(echo,0.5))+'  p90 '+f0(pct(echo,0.9))+'  max '+f0(echo.length?Math.max(...echo):null)+' ms  lost '+N.echo.lost+'/'+N.echo.sent,
    'smoothing: '+(N.smooth==='auto'?'auto (per player, below)':N.smooth?N.smooth+' ms behind':'off (raw: drawn at the newest update)')+'  waves sent '+N.acts.sent+' heard '+N.acts.heard+'  jumps '+me.jumps+'  ceiling bumps '+me.bonks+'  eased apart '+me.pushes+' frames',
    'nuzzles: started '+N.nz.led+'  joined '+N.nz.joined+'  hearts '+heartsShown+'  last mutual wave: '+N.nz.why,
  ];
  for(const R of N.peers.values()){
    const md=R.modes, tot=Math.max(1,md.interp+md.extrap+md.hold+md.early+md.raw), pc=v=>Math.round(v/tot*100)+'%';
    const late=R.late.map(q=>q.v), st=R.superseded?'replaced by a newer page, hidden':R.hidden?'hidden (no updates for '+Math.round((t-R.lastRecv)/1000)+' s)':R.away?(R.hid?'away (page in background)':'away (no updates for '+Math.round((t-R.lastRecv)/1000)+' s)'):'live';
    lines.push('peer '+displayName(R)+' ('+R.peer.slice(0,6)+(R.guest?', guest':'')+(R.isMe?', your other tab':'')+'): '+st+'  '+
      'updates '+(R.recvs.filter(x=>x>t-2000).length/2).toFixed(1)+'/s  gaps '+statsLine(R.gaps)+' ms  jitter p95 '+f0(pct(late,0.95))+' ms  buffer '+f0(delayOf(R))+' ms'+(N.smooth==='auto'?' (auto, aiming '+f0(R.Dt)+')':'')+
      '  too late for buffer '+R.tooLate+'/'+R.n+'  skipped seq '+R.skipped+'  bad '+R.bad+'  last update '+f0(R.lastRecv?t-R.lastRecv:null)+' ms ago');
    lines.push('  ping median '+f0(pct(R.rtt,0.5))+'  p90 '+f0(pct(R.rtt,0.9))+'  max '+f0(R.rtt.length?Math.max(...R.rtt):null)+' ms  lost '+R.pingLost+'/'+R.pingSent+
      '  drawn: interp '+pc(md.interp)+' extrap '+pc(md.extrap)+' hold '+pc(md.hold)+' early '+pc(md.early)+(md.raw?' raw '+pc(md.raw):'')+
      '  suit '+(R.sk>=0?SUITS[R.sk].name:'deciding')+(R.fp?' (1P)':'')+(R.tm?'  at terminal '+R.tm.slice(0,6):'')+'  waves heard '+R.acts+'  here '+Math.round((t-R.joinedAt)/1000)+' s');
  }
  lines.push('--- build',
    'database: '+B.dbState+(B.dbMs!=null?' after '+f0(B.dbMs)+' ms':'')+'  snapshots '+B.snaps+' (from cache '+B.cacheSnaps+', with your pending writes '+B.pendingSnaps+')  bad pieces '+B.bad+(B.legacy?'  from 0.2 (no height) '+B.legacy:'')+(B.readOnly?'  READ ONLY':''),
    'pieces shown: '+B.list.length+' ('+KINDS.map((K,i)=>K.name.toLowerCase()+' '+kc[i]).join(', ')+')  raised '+raised+'  saved '+B.dbDocs.size+'  waiting for the database '+B.evAdds.size+'  just removed '+B.tombs.size,
    'yours: placed '+B.placed+'  removed '+B.removed+'  saved ok '+B.writeOk+'  removed ok '+B.delOk+(Object.keys(B.writeErr).length?'  errors '+JSON.stringify(B.writeErr):'  errors none')+
      '  save time median '+f0(pct(B.ack,0.5))+' max '+f0(B.ack.length?Math.max(...B.ack):null)+' ms',
    'others’ pieces: heard by event '+B.evHeard+'  event first '+B.evFirst+'  database first '+B.dbFirst+'  database behind the event: median '+f0(pct(B.dbAfterEv,0.5))+' max '+f0(B.dbAfterEv.length?Math.max(...B.dbAfterEv):null)+' ms',
    'build mode: '+(building?'on, '+(B.sel===REMOVE?'remove':KINDS[B.sel].name.toLowerCase()+' at '+(B.rot*15)+'°'+(B.ghost.reason?' ('+B.ghost.reason+')':B.ghost.how?' ('+B.ghost.how+')':'')):'off')+'  wall bumps '+me.bumps+'  feet at '+me.y.toFixed(2)+' m'+(me.gr?'':' (in the air)'),
    'terminals: '+terms.length+(terms.length?' (samples logged '+terms.map(p=>termN(p.id)).join(', ')+')':'')+'  uses '+TS.uses+'  solved here '+TS.solved+'  heard solved '+TS.heard+(Object.keys(TS.saveErr).length?'  save errors '+JSON.stringify(TS.saveErr):'')+
      (TS.open?'  open: '+TS.parts.length+' at it, you '+(TS.watcher?'watch':TS.mineF&&TS.mineA?'turn both':TS.mineF?'turn frequency':'turn amplitude')+', match '+TS.m.toFixed(2)+' held '+TS.held.toFixed(1)+' s':''));
  lines.push('3d library: '+(window.__lib||'?')+'  errors: '+errs.n+(errs.ext?'  (plus '+errs.ext+' hidden "Script error." from outside the page)':''));
  errs.list.forEach((x,i)=>lines.push(errLine(x,i+1))); if(errs.last) lines.push(errLine(errs.last,'latest'));
  lines.push('ua: '+navigator.userAgent);
  return lines.join('\n');
}
function setDiag(on){ $('diag').hidden=!on; $('diagShade').hidden=!on; }
function openDiag(){ $('diagText').value=diagText(); $('diagMsg').textContent='Copy this and paste it back to Claude.'; setDiag(true); }
$('readout').onclick=openDiag;
$('readout').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDiag(); } });
$('diagShade').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); setDiag(false); });
$('bClose').onclick=()=>setDiag(false);
const RATES=[10,15,20,30], SMOOTHS=['auto',120,200,0,60];
$('bRate').onclick=()=>{ N.sendHz=RATES[(RATES.indexOf(N.sendHz)+1)%RATES.length]; $('bRate').textContent='Send '+N.sendHz+'/s'; $('diagText').value=diagText(); };
$('bSmooth').onclick=()=>{ N.smooth=SMOOTHS[(SMOOTHS.indexOf(N.smooth)+1)%SMOOTHS.length]; $('bSmooth').textContent=N.smooth==='auto'?'Smooth auto':N.smooth?'Smooth '+N.smooth+' ms':'Smooth off';
  for(const R of N.peers.values()){ R.modes={interp:0,extrap:0,hold:0,early:0,raw:0}; R.tooLate=0; R.n=0; } $('diagText').value=diagText(); };
$('bCopy').onclick=()=>{ const ta=$('diagText'); ta.value=diagText();
  const fallback=()=>{ ta.focus(); ta.select(); $('diagMsg').textContent='Selected. Use your phone’s Copy.'; };
  try{ navigator.clipboard.writeText(ta.value).then(()=>{ $('diagMsg').textContent='Copied.'; },fallback); }catch(_){ fallback(); } };

// ================================================================ HUD
function hud(t,tp){
  $('fps').textContent=fpsNow||'--'; $('fpslow').textContent=fpsHist.length?Math.min(...fpsHist):'--';
  const live=[...N.peers.values()].filter(R=>R.live).length;
  $('nplay').textContent=String(live+1);
  const ok=N.state==='open' && N.connected && !N.ended;
  $('dot').className='dot'+(ok?' live':(N.state==='open' && N.everConnected)||N.ended||N.state==='unavailable'?' down':'');
  const bp=bestPing(), em=pct(N.echo.rtt,0.5);
  $('pingLine').innerHTML=bp!=null?'ping <b>'+bp+'</b> ms':em!=null?'echo <b>'+em+'</b> ms':'ping <b>--</b> ms';
  let msg='Joining the co-op room…', warn=false;
  if(tp<statusUntil){ msg=statusMsg; }
  else if(N.state==='no-runtime'){ msg='Solo here. Open the artifact link to play together.'; warn=true; }
  else if(N.state==='unavailable'){ msg='Co-op room not available in this view.'; warn=true; }
  else if(N.state==='open'){
    if(N.ended){ msg='Room closed ('+N.ended+').'; warn=true; }
    else if(!N.connected){ if(N.everConnected && N.downAt && t-N.downAt>2000){ msg='Connection lost. Reconnecting…'; warn=true; } else if(!N.everConnected) msg='Connecting…'; else msg=$('status').textContent; }
    else if(!live) msg=N.peers.size?'The others are away.':'Alone here. Open this link on a second device.';
    else msg=(live+1)+' players on the regolith'+(bp!=null?' · ping '+bp+' ms':'');
  }
  const st=$('status'); st.textContent=msg; st.className=warn?'warn':'';
  const ta=$('diagText'); if(!$('diag').hidden && document.activeElement!==ta){ const sc=ta.scrollTop; ta.value=diagText(); ta.scrollTop=sc; }
  const E=$('err'); if(errs.n){ E.hidden=false; E.textContent=errs.n+' error'+(errs.n>1?'s':'')+' · tap the readout for the Diag'; }
  if(N.canWrite===false) B.readOnly=true;
  $('bBuild').disabled=B.readOnly;
  $('bUse').hidden=!nearTerminal() || TS.open;
}

// ================================================================ start: compile every suit and piece behind the first frame, then run
{ const proto=[]; for(let i=0;i<SUIT_N;i++){ const c=makeCapy(i); c.root.position.set(0,-50,0); proto.push(c); }
  ghost.visible=true; inst.forEach(list=>list.forEach(im=>{ im.count=1; }));
  checkResize(); updateCamera(0);
  try{ renderer.compile(scene,camera); }catch(e){ noteErr(e,'compile'); }
  proto.forEach(dropCapy); ghost.visible=false; inst.forEach(list=>list.forEach(im=>{ im.count=0; })); }
netStart();
let last=performance.now(), hudT=0, suitT=0, bootSec=0;
function frame(){
  requestAnimationFrame(frame);
  const tp=performance.now(); let dt=(tp-last)/1000; last=tp;
  const ft=dt*1000; if(ft>winWorst) winWorst=ft; frames++;
  if(tp-winStart>=1000){ fpsNow=Math.round(frames*1000/(tp-winStart)); frames=0; winStart=tp;
    pushCap(fpsHist,fpsNow,10); pushCap(worstHist,winWorst,10); winWorst=0;
    if(bootSec<12){ startHist.push(fpsNow); startVis.push((document.visibilityState==='visible'?'v':'h')+(document.hasFocus&&document.hasFocus()?'f':'-')); bootSec++; }
    simMs=simSum/Math.max(1,fpsNow); drawMs=drawSum/Math.max(1,fpsNow); simMsMax=simMax; drawMsMax=drawMax; simSum=drawSum=simMax=drawMax=0; }
  if(dt>0.1) dt=0.1;
  try{
    checkResize();
    const s0=performance.now(), t=Date.now(), ts=tp/1000;
    if(B.dirty || ((B.evAdds.size||B.tombs.size) && t-B.lastPrune>2000)) rebuildPieces();
    for(const R of N.peers.values()) peerState(R,t);
    const prevAp=me.ap, prevAct=me.act;
    updateLocal(dt,tp);
    netTick(t);
    if(t-suitT>1000){ suitT=t; pickSuit(); }
    poseCapy(me.capy,dt,ts,me.x,me.ys,me.z,!me.gr,me.yaw,me.spd,me.act,me.ap,me.gr?me.ys:supportAt(me.x,me.z,me.y+0.02));
    if(prevAct===2) heartsFor(me.capy,prevAp,me.act===2?me.ap:NUZ_DUR,2);
    for(const R of N.peers.values()){
      if(N.smooth==='auto') adaptDelay(R,t,dt);
      const P=samplePose(R,t);
      if(!P || R.hidden){ if(R.capy) R.capy.root.visible=false; continue; }
      if(!R.capy || R.capy.si!==R.sk){ const old=R.capy; R.capy=makeCapy(R.sk); if(old){ R.capy.ph=old.ph; dropCapy(old); } }
      R.capy.root.visible=true;
      poseCapy(R.capy,dt,ts,P.x,P.h,P.z,!P.g,P.y,P.m,P.a,P.ap,supportAt(P.x,P.z,P.h+0.05));
      heartsFor(R.capy,R.lastAp,P.ap,P.a); R.lastAp=P.a===2?P.ap:0;
      refreshName(R,t);
    }
    updateHearts(dt);
    updateCamera(dt);
    if(building) updateGhost();
    if(TS.open){ drawTerm(ts); }
    beacon.visible=(t%1000)<140;
    camera.updateMatrixWorld();
    for(const R of N.peers.values()) placeTag(R,vw,vh);
    if(tp-hudT>250){ hudT=tp; hud(t,tp); for(const R of N.peers.values()) tagText(R,t); buildInfo(tp); if(TS.open) termUI(tp); }
    const s1=performance.now();
    renderer.render(scene,camera);
    const s2=performance.now();
    calls=renderer.info.render.calls; tris=renderer.info.render.triangles;
    simSum+=s1-s0; drawSum+=s2-s1; if(s1-s0>simMax) simMax=s1-s0; if(s2-s1>drawMax) drawMax=s2-s1;
  }catch(e){ noteErr(e,'frame'); }
}
requestAnimationFrame(frame);
window.__np={N,B,TS,me,KINDS,diag:diagText,get view(){ return view; },get building(){ return building; },
  get camYaw(){ return camYaw; },set camYaw(v){ camYaw=v; },get camPitch(){ return camPitch; },set camPitch(v){ camPitch=v; },
  set aimRay(v){ aimRay=v; },supportAt,samplePose,setBuilding,selectPiece,rotate,placePiece,heartsShown:()=>heartsShown,
  nearTerminal,openTerminal,closeTerminal,termTarget,termN,setDials:(f,a)=>{ if(f!=null) TS.f=f; if(a!=null) TS.a=a; },suitChanges:()=>suitChanges};
})();
