<style>
  /* Layout: the 3D view fills the screen. Title and readout chips sit in the top corners inside the safe area;
     the walk stick appears under the left thumb, Jump / Wave / View sit under the right thumb. Single dark look, like Lunabara. */
  :root{
    color-scheme: dark;
    --sky:#000000;
    --panel:rgba(14,14,16,0.72);
    --panel-solid:rgba(10,10,12,0.95);
    --well:#000000;
    --line:rgba(255,236,200,0.14);
    --text:#ece6da;
    --dim:#9a9488;
    --sun:#ffb347;
    --sun-wash:rgba(255,179,71,0.22);
    --ice:#7fd4e6;
    --ice-wash:rgba(127,212,230,0.2);
    --ok:#7fe0a0;
    --warn:#ff7a59;
    --stick:rgba(236,230,218,0.35);
    --stick-knob:rgba(236,230,218,0.55);
    --stick-fill:rgba(14,14,16,0.25);
    --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --pixel:"Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
  }
  html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--text);font-family:var(--mono);}
  [hidden]{display:none!important;}   /* the Diag and stick set their own display; hidden must still win */
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  #stage{position:fixed;inset:0;touch-action:none;}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;}

  .chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  #top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
       padding-top:calc(env(safe-area-inset-top,0px) + 12px);
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
  #top > *{pointer-events:auto;}
  #title{min-width:0;max-width:62%;}
  #title .name{font-family:var(--pixel);font-size:15px;letter-spacing:.06em;line-height:1.1;}
  #title .sub{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-top:3px;}
  #status{font-size:11px;color:var(--ice);margin-top:5px;line-height:1.35;}
  #status.warn{color:var(--warn);}
  #readout{font-size:11px;line-height:1.5;text-align:right;font-variant-numeric:tabular-nums;min-width:112px;cursor:pointer;}
  #readout b{font-weight:600;}
  #readout .tapdiag{color:var(--dim);font-size:9px;letter-spacing:.06em;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:5px;vertical-align:1px;}
  .dot.live{background:var(--ok);} .dot.down{background:var(--warn);}

  #hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);max-width:calc(100% - 230px);
        font-size:11px;line-height:1.45;color:var(--dim);pointer-events:none;transition:opacity .8s;text-shadow:0 1px 3px #000;}
  #hint.gone{opacity:0;}

  button{font:600 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text);
         background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;
         -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;touch-action:manipulation;}
  button:focus-visible{outline:2px solid var(--sun);outline-offset:2px;}
  #pad{position:fixed;width:170px;height:156px;pointer-events:none;
       right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);}
  #pad button{position:absolute;pointer-events:auto;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;}
  #bJump{right:0;bottom:0;width:78px;height:78px;font-size:12px;border-color:var(--sun);color:var(--sun);}
  #bJump.on{background:var(--sun-wash);}
  #bWave{right:90px;bottom:8px;width:58px;height:58px;}
  #bView{right:10px;bottom:92px;width:58px;height:58px;}
  #bWave.on,#bView.on{background:var(--ice-wash);}

  #stick{position:fixed;left:0;top:0;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;
         border:1.5px solid var(--stick);background:var(--stick-fill);pointer-events:none;}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--stick-knob);}

  #tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .tag{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;will-change:transform;
       text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8);}
  .tag .n{font-family:var(--pixel);font-size:12px;letter-spacing:.06em;color:var(--sun);}
  .tag .p{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .tag.stale .p{color:var(--warn);}

  #diagShade{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.28);}
  #diag{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:560px;margin:auto;z-index:9;
        background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;
        max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
  #diag textarea{width:100%;height:260px;flex:1 1 auto;min-height:60px;background:var(--well);color:var(--text);border:1px solid var(--line);
        border-radius:8px;font:11px/1.45 var(--mono);padding:8px;box-sizing:border-box;-webkit-user-select:text;user-select:text;resize:none;}
  #diag .row{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--dim);}
  #diag .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  #diag button{min-height:36px;padding:8px 12px;}
  #err{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 180px);font-size:11px;color:var(--warn);text-align:center;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ #hint{transition:none;} }
</style>

<script>
// Error log, started first so it also sees errors from the 3D library while it loads (same as the terrarium probes).
window.__errs={n:0,list:[],last:null,t0:Date.now(),ext:0};
window.__noteErr=function(kind,msg,file,line,col,stack){
  var E=window.__errs;
  if(kind==='page' && String(msg)==='Script error.' && !file){ E.ext++; return; }
  E.n++;
  var x={kind:kind,msg:String(msg||'').slice(0,160),file:String(file||''),line:line||0,col:col||0,s:((Date.now()-E.t0)/1000).toFixed(1),
         stack:String(stack||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).slice(0,3).join(' < ').slice(0,260)};
  if(E.list.length<5) E.list.push(x); else E.last=x;
};
window.addEventListener('error',function(ev){
  var tg=ev.target;
  if(tg && tg!==window && (tg.src||tg.href)){ window.__noteErr('load failed','',tg.src||tg.href,0,0,''); return; }
  var e=ev.error; window.__noteErr('page',ev.message,ev.filename,ev.lineno,ev.colno,e&&e.stack);
},true);
window.addEventListener('unhandledrejection',function(ev){ var r=ev.reason; window.__noteErr('promise',(r&&r.message)||String(r),'',0,0,r&&r.stack); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
window.__lib='cors';
if(!window.THREE){ window.__lib='fallback: plain load'; document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>'); }

<script>
(function(){
const BUILD='0.1';
const $=id=>document.getElementById(id);
$('buildLine').textContent='net probe '+BUILD+' · co-op test';
const errs=window.__errs;
function noteErr(e,where){ if(window.__noteErr) window.__noteErr(where,(e&&e.message)||String(e),'',0,0,e&&e.stack); }
function errLine(x,i){ const f=x.file?x.file.split('?')[0].split('/').pop()||x.file:'';
  return '  #'+i+' '+x.kind+' at '+x.s+'s: '+(x.msg||'(no message)')+(f?' @ '+f+(x.line?':'+x.line+':'+x.col:''):'')+(x.stack?' | '+x.stack:''); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const r2=v=>Math.round(v*100)/100, r3=v=>Math.round(v*1000)/1000;
function angDiff(a,b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d; }
function pct(a,p){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.min(s.length-1,Math.round(p*(s.length-1)))]; }
function pushCap(a,v,n){ a.push(v); if(a.length>n) a.shift(); }

// ================================================================ net
// Co-op over the artifact room. Each player's capybara rides in presence (absolute state, a fixed rate);
// moments (wave) and the ping/echo probes go out as events. Everything received is checked before use.
const SUIT_N=4;
const N={state:'starting', t0:Date.now(), useMs:null, room:null, user:null,
  connected:false, everConnected:false, firstConn:null, downAt:null, drops:0, blips:0, downMs:0, ended:null,
  me:{peer:null,by:null,owner:null,canEdit:null,id:null,name:''},
  peers:new Map(), agents:0, guests:0, myTabs:0, deliveries:0,
  sendHz:15, smooth:120, seq:0, lastSend:0, sentTimes:[], bytes:0, presOk:0, presErr:{},
  emitOk:0, emitErr:{}, emitBlocked:{}, emitSkipped:0,
  echo:{k:0,pend:new Map(),rtt:[],lost:0,sent:0,next:0},
  ping:{k:0,pend:new Map(),sent:0,next:0},
  acts:{sent:0,heard:0}, onJoin:null, onLeave:null, onAct:null};
const finite=(v,lim)=>typeof v==='number' && isFinite(v) && Math.abs(v)<=lim;
const EXTRAP_MAX=250;

function netStart(){
  const C=window.claude;
  if(!C || typeof C.use!=='function'){ N.state='no-runtime'; return; }
  const t0=Date.now();
  C.use('room').then(room=>{ N.useMs=Date.now()-t0; if(!room){ N.state='unavailable'; return; } N.room=room; N.state='open'; attach(room); },
                     e=>{ N.useMs=Date.now()-t0; N.state='unavailable'; noteErr(e,'room'); });
  C.use('user').then(u=>{ if(!u) return; N.user=u;
    u.me().then(v=>{ N.me.owner=!!v.isOwner; N.me.canEdit=!!v.canEdit; N.me.id=v.id||null; N.me.name=v.name||''; }).catch(()=>{}); }, ()=>{});
}
function attach(room){
  const term=e=>{ if(e && e.code && !N.ended){ N.ended=e.code; N.connected=false; } };
  room.onConnection(c=>{ const t=Date.now();
    if(c){ if(N.firstConn==null) N.firstConn=t-N.t0;
      if(N.downAt!=null && N.everConnected){ const d=t-N.downAt; N.downMs+=d; if(d>2000) N.drops++; else N.blips++; }
      N.downAt=null; N.connected=true; N.everConnected=true; }
    else { if(N.connected) N.downAt=t; N.connected=false; } }, term);
  room.onPeers(onPeers, term);
  room.on('echo',m=>{ if(!m.sameTab) return; const k=m.data&&m.data.k, t0=N.echo.pend.get(k);
    if(t0!=null){ N.echo.pend.delete(k); pushCap(N.echo.rtt,Date.now()-t0,40); } }, term);
  room.on('ping',m=>{ if(m.sameTab || m.kind!=='viewer') return; const d=m.data; if(!d || !finite(d.k,1e9)) return; emit('pong',{k:d.k,to:m.peer}); }, term);
  room.on('pong',m=>{ if(m.sameTab) return; const d=m.data; if(!d || d.to!==N.me.peer) return;
    const P=N.ping.pend.get(d.k); if(!P || P.got.has(m.peer)) return; P.got.add(m.peer);
    const R=N.peers.get(m.peer); if(R) pushCap(R.rtt,Date.now()-P.t,40); }, term);
  room.on('act',m=>{ if(m.sameTab) return; const d=m.data; if(!d || typeof d.kind!=='string') return;
    N.acts.heard++; const R=N.peers.get(m.peer); if(R){ R.acts++; if(N.onAct) N.onAct(R,d.kind.slice(0,16)); } }, term);
}
function emit(topic,data){
  if(!N.room || N.ended || N.emitBlocked[topic]) return false;
  if(!N.room.connected()){ N.emitSkipped++; return false; }
  N.room.emit(topic,data).then(()=>{ N.emitOk++; }, e=>{ const c=(e&&e.code)||'error'; N.emitErr[c]=(N.emitErr[c]||0)+1; if(c==='not_permitted') N.emitBlocked[topic]=true; });
  return true;
}
function newRemote(p,t){ return {peer:p.peer, by:p.by, guest:!!p.guest, isMe:!!p.isMe, name:'', nameAt:0, nameBy:null, presObj:null,
  buf:[], offs:[], off:0, late:[], gaps:[], recvs:[], rtt:[], lastSeq:null, lastRecv:0, n:0, skipped:0, tooLate:0, bad:0, joinedAt:t,
  modes:{interp:0,extrap:0,hold:0,early:0,raw:0}, acts:0, pingSent:0, pingLost:0, pose:{x:0,z:0,h:0,y:0,m:0}, sk:-1, fp:0,
  capy:null, tag:null, waveQueued:0, mode:'none'}; }
function onPeers(ch){
  const t=Date.now(); N.deliveries++;
  let agents=0, guests=0, tabs=0; const seen=new Set();
  for(const p of ch.peers){
    if(p.kind!=='viewer'){ agents++; continue; }
    if(p.sameTab){ N.me.peer=p.peer; if(p.by) N.me.by=p.by; continue; }
    if(p.guest) guests++; if(p.isMe) tabs++;
    seen.add(p.peer);
    let R=N.peers.get(p.peer);
    if(!R){ R=newRemote(p,t); N.peers.set(p.peer,R); if(N.onJoin) N.onJoin(R); }
    R.by=p.by; R.guest=!!p.guest; R.isMe=!!p.isMe;
    if(p.presence!==R.presObj){ R.presObj=p.presence; ingest(R,p.presence,t); }
  }
  for(const [k,R] of N.peers) if(!seen.has(k)){ N.peers.delete(k); if(N.onLeave) N.onLeave(R); }
  N.agents=agents; N.guests=guests; N.myTabs=tabs;
}
function ingest(R,p,t){
  if(!p || p.v!==1) return;
  if(!finite(p.s,1e9) || !finite(p.t,1e15) || !finite(p.x,5000) || !finite(p.z,5000)){ R.bad++; return; }
  if(R.lastSeq!=null){
    if(p.s<=R.lastSeq){ if(p.s>=R.lastSeq-5) return; R.buf.length=0; }   // a big step back: the sender reloaded
    else if(p.s>R.lastSeq+1) R.skipped+=p.s-R.lastSeq-1;               // coalesced or lost on the way
  }
  R.lastSeq=p.s; R.n++;
  // Clock offset: their clock to ours plus the fastest delivery seen in the last 10 s. Renders on their timeline.
  const o=t-p.t; R.offs.push({o,at:t}); while(R.offs.length && R.offs[0].at<t-10000) R.offs.shift();
  let mn=Infinity; for(const q of R.offs) if(q.o<mn) mn=q.o; R.off=mn;
  const late=o-R.off; R.late.push({v:late,at:t}); while(R.late.length && R.late[0].at<t-10000) R.late.shift();
  if(N.smooth>0 && late>N.smooth) R.tooLate++;
  if(R.lastRecv){ R.gaps.push({v:t-R.lastRecv,at:t}); while(R.gaps.length && R.gaps[0].at<t-10000) R.gaps.shift(); }
  R.lastRecv=t; R.recvs.push(t); while(R.recvs.length && R.recvs[0]<t-2000) R.recvs.shift();
  const s={t:p.t, x:p.x, z:p.z, h:finite(p.h,100)?Math.max(0,p.h):0, y:finite(p.y,100)?p.y:0, m:finite(p.m,50)?Math.max(0,p.m):0};
  R.sk=finite(p.sk,99)?((p.sk|0)%SUIT_N+SUIT_N)%SUIT_N:0; R.fp=p.fp?1:0;
  const last=R.buf[R.buf.length-1];
  if(last){ if(s.t<=last.t) return; if(Math.hypot(s.x-last.x,s.z-last.z)>8) R.buf.length=0; }
  R.buf.push(s); if(R.buf.length>120) R.buf.shift();
}
// Where a remote capybara is drawn now: interpolated N.smooth ms behind its newest update, on its own clock.
function samplePose(R,t){
  const S=R.buf, P=R.pose; if(!S.length){ R.mode='none'; return null; }
  const last=S[S.length-1];
  const put=(a)=>{ P.x=a.x; P.z=a.z; P.h=a.h; P.y=a.y; P.m=a.m; };
  if(N.smooth===0){ put(last); R.mode='raw'; R.modes.raw++; return P; }
  const rt=t-R.off-N.smooth;
  while(S.length>2 && S[1].t<=rt) S.shift();
  if(rt<=S[0].t){ put(S[0]); R.mode='early'; R.modes.early++; return P; }
  if(S.length>=2 && rt<=last.t){
    let i=0; while(i<S.length-2 && S[i+1].t<rt) i++;
    const a=S[i], b=S[i+1], k=(rt-a.t)/Math.max(1,b.t-a.t);
    P.x=a.x+(b.x-a.x)*k; P.z=a.z+(b.z-a.z)*k; P.h=a.h+(b.h-a.h)*k; P.y=a.y+angDiff(a.y,b.y)*k; P.m=a.m+(b.m-a.m)*k;
    R.mode='interp'; R.modes.interp++; return P;
  }
  const dx=Math.min(rt-last.t,EXTRAP_MAX);
  if(S.length>=2){ const pv=S[S.length-2], dt=Math.max(1,last.t-pv.t);
    P.x=last.x+(last.x-pv.x)/dt*dx; P.z=last.z+(last.z-pv.z)/dt*dx; P.h=Math.max(0,last.h+(last.h-pv.h)/dt*dx); P.y=last.y; P.m=last.m;
  } else put(last);
  if(rt-last.t<=EXTRAP_MAX){ R.mode='extrap'; R.modes.extrap++; } else { R.mode='hold'; R.modes.hold++; P.m=0; }
  return P;
}
function netTick(t,me){
  if(!N.room || N.ended) return;
  if(t-N.lastSend>=1000/N.sendHz-2){
    N.lastSend=t; N.seq++;
    const pres={v:1,s:N.seq,t,x:r2(me.x),z:r2(me.z),h:r2(me.h),y:r3(me.yaw),m:r2(me.spd),sk:me.suit,fp:me.fp?1:0};
    N.room.presence(pres).then(()=>{ N.presOk++; }, e=>{ const c=(e&&e.code)||'error'; N.presErr[c]=(N.presErr[c]||0)+1; });
    N.sentTimes.push(t); while(N.sentTimes.length && N.sentTimes[0]<t-2000) N.sentTimes.shift();
    if(N.seq%30===1) N.bytes=JSON.stringify(pres).length;
  }
  if(t>=N.echo.next){ N.echo.next=t+1000; const k=N.echo.k+1; N.echo.pend.set(k,t);
    if(emit('echo',{k})){ N.echo.k=k; N.echo.sent++; } else N.echo.pend.delete(k); }
  for(const [k,v] of N.echo.pend) if(t-v>5000){ N.echo.pend.delete(k); N.echo.lost++; }
  if(t>=N.ping.next && N.peers.size){ N.ping.next=t+1000; const k=N.ping.k+1, expect=[...N.peers.keys()];
    N.ping.pend.set(k,{t,expect,got:new Set()});
    if(emit('ping',{k})){ N.ping.k=k; N.ping.sent++; for(const id of expect){ const R=N.peers.get(id); if(R) R.pingSent++; } } else N.ping.pend.delete(k); }

function dropCapy(c){ if(c) scene.remove(c.root); }
function poseCapy(c,dt,t,x,z,h,yaw,spd){
  c.root.position.set(x,0,z); c.root.rotation.y=yaw;
  const m=Math.min(1,spd/2.6), air=h>0.04;
  c.ph+=spd*dt*(Math.PI*2/0.95);          // a full stride per 0.95 m walked, so feet don't skate
  c.lift.position.y=h+(air?0:0.035*Math.abs(Math.sin(c.ph))*m);
  if(c.waveT>0) c.waveT=Math.max(0,c.waveT-dt);
  const e=c.waveT>0?Math.min(1,(WAVE_DUR-c.waveT)/0.3,c.waveT/0.3):0;
  c.rear.rotation.x=-0.6*e;
  for(let i=0;i<4;i++){ const l=c.legs[i], f=l.userData.front, off=(i===0||i===3)?0:Math.PI, s=Math.sin(c.ph+off);
    let hx,kx;
    if(air){ hx=f?-0.55:0.55; kx=(f?1:-1)*0.6; }
    else { hx=0.42*m*s; kx=(f?1:-1)*0.75*m*Math.max(0,-Math.cos(c.ph+off)); }
    if(i===0 && e>0){ hx=hx*(1-e)+e*(-2.1+0.35*Math.sin(t*13)); kx=kx*(1-e)+e*0.5; }
    if(i===1 && e>0){ hx=hx*(1-e)-e*0.5; }
    l.rotation.x=hx; l.userData.knee.rotation.x=kx; }
  c.head.rotation.x=air?-0.15:(-0.25*e+0.04*Math.sin(c.ph*2)*m);
  c.blush[0].visible=c.blush[1].visible=e>0.2;
  const sc=1/(1+h*0.7); c.shadow.scale.set(0.62*sc,1,0.95*sc);
}

function pickSuit(){
  const pref=N.me.owner===false?1:0, taken=new Set();
  for(const R of N.peers.values()) if(R.sk>=0 && N.me.peer && R.peer<N.me.peer) taken.add(R.sk);
  let s=pref; if(taken.has(s)){ for(let i=0;i<SUIT_N;i++) if(!taken.has(i)){ s=i; break; } }
  if(s!==me.suit){ me.suit=s; const old=me.capy; me.capy=makeCapy(s); me.capy.ph=old.ph; me.capy.waveT=old.waveT; dropCapy(old); }
}

    stick.ix=dx/STICK_R; stick.iy=-dy/STICK_R; if(Math.hypot(stick.ix,stick.iy)<0.12){ stick.ix=0; stick.iy=0; }
    knob.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)'; }
  else if(look && e.pointerId===look.id){ const k=e.pointerType==='mouse'?0.004:lookSpeed();
    camYaw-=(e.clientX-look.lx)*k; camPitch+=(e.clientY-look.ly)*k; clampPitch(); look.lx=e.clientX; look.ly=e.clientY; }
});
function endPtr(e){ if(stick && e.pointerId===stick.id){ stick=null; stickEl.hidden=true; } if(look && e.pointerId===look.id) look=null; }
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr); stage.addEventListener('lostpointercapture',endPtr);
function clampPitch(){ camPitch=view==='first'?clamp(camPitch,-1.2,1.2):clamp(camPitch,-0.3,1.1); }
const KEYMAP={w:'f',arrowup:'f',s:'b',arrowdown:'b',a:'l',arrowleft:'l',d:'r',arrowright:'r'};
window.addEventListener('keydown',e=>{ const k=String(e.key||'').toLowerCase();
  if(!$('diag').hidden){ if(k==='escape') setDiag(false); return; }
  if(KEYMAP[k]){ keys[KEYMAP[k]]=1; e.preventDefault(); return; }
  if(k===' '){ jumpReq=performance.now(); e.preventDefault(); } else if(k==='e') doWave(); else if(k==='v') toggleView(); else if(k==='`') openDiag(); });
window.addEventListener('keyup',e=>{ const k=String(e.key||'').toLowerCase(); if(KEYMAP[k]) keys[KEYMAP[k]]=0; });
window.addEventListener('blur',()=>{ keys.f=keys.b=keys.l=keys.r=0; stick=null; look=null; stickEl.hidden=true; });
function flash(el){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),160); }
$('bJump').addEventListener('pointerdown',e=>{ e.preventDefault(); jumpReq=performance.now(); flash($('bJump')); wake(); });
$('bWave').onclick=()=>{ doWave(); flash($('bWave')); };
$('bView').onclick=()=>{ toggleView(); flash($('bView')); };
function doWave(){ if(me.capy.waveT>0) return; me.capy.waveT=WAVE_DUR; me.waves++; N.acts.sent++; emit('act',{kind:'wave'}); }
function toggleView(){ view=view==='first'?'shoulder':'first'; $('bView').textContent=view==='first'?'3P':'1P'; clampPitch(); }
let wakeLock='not asked';
function wake(){ if(wakeLock!=='not asked') return; wakeLock='asked';
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(()=>{ wakeLock='on'; },()=>{ wakeLock='refused'; }); else wakeLock='unsupported'; }catch(_){ wakeLock='refused'; } }
if(!('ontouchstart' in window) && !(navigator.maxTouchPoints>0)) $('hint').textContent='WASD walks · drag to look · Space jumps · E waves · V camera';

// ================================================================ local movement and camera
function updateLocal(dt,tp){
  let ix=keys.r-keys.l, iy=keys.f-keys.b;
  if(stick){ ix+=stick.ix; iy+=stick.iy; }
  let mag=Math.hypot(ix,iy); if(mag>1){ ix/=mag; iy/=mag; mag=1; }
  if(mag>0.05 && !moved){ moved=true; $('hint').classList.add('gone'); }
  const fx=Math.sin(camYaw), fz=Math.cos(camYaw), rx=-fz, rz=fx;
  const tvx=(fx*iy+rx*ix)*SPEED, tvz=(fz*iy+rz*ix)*SPEED, k=Math.min(1,dt*(mag>0.01?9:12));
  me.vx+=(tvx-me.vx)*k; me.vz+=(tvz-me.vz)*k;
  me.x=clamp(me.x+me.vx*dt,-140,140); me.z=clamp(me.z+me.vz*dt,-140,140);
  me.spd=Math.hypot(me.vx,me.vz);
  if(view==='first') me.yaw=camYaw;
  else if(me.spd>0.25){ const want=Math.atan2(me.vx,me.vz), d=angDiff(me.yaw,want), mx=9*dt; me.yaw+=clamp(d,-mx,mx); }
  if(jumpReq && tp-jumpReq>160) jumpReq=0;
  if(jumpReq && me.h<=0 && me.vy<=0){ me.vy=JUMP_V; jumpReq=0; me.jumps++; }
  if(me.h>0 || me.vy>0){ me.vy-=GRAV*dt; me.h+=me.vy*dt; if(me.h<=0){ me.h=0; me.vy=0; } }
  me.fp=view==='first';
}
function updateCamera(dt){
  const cy=camYaw, cp=camPitch, fx=Math.sin(cy)*Math.cos(cp), fy=-Math.sin(cp), fz=Math.cos(cy)*Math.cos(cp);
  if(view==='first'){
    camera.position.set(me.x+Math.sin(me.yaw)*1.0, me.capy.lift.position.y+0.95, me.z+Math.cos(me.yaw)*1.0);
  } else {
    pivotY+=(me.h-pivotY)*Math.min(1,dt*8);
    const rx=-Math.cos(cy), rz=Math.sin(cy), D=3.6;
    camera.position.set(me.x-fx*D+rx*0.7, Math.max(0.35,pivotY+1.2-fy*D+0.25), me.z-fz*D+rz*0.7);
  }
  camera.lookAt(camera.position.x+fx,camera.position.y+fy,camera.position.z+fz);
  me.capy.neck.visible=me.capy.head.visible=view!=='first';   // first person: the camera is in your own helmet
  sky.position.copy(camera.position);
}

// ================================================================ resize
let vw=0, vh=0, resizes=0;
function checkResize(){ const w=stage.clientWidth||window.innerWidth, h=stage.clientHeight||window.innerHeight;
  if(w===vw && h===vh) return; vw=w; vh=h; resizes++;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?62:50; camera.updateProjectionMatrix(); }

// ================================================================ diagnostics
const fpsHist=[], worstHist=[], startHist=[]; let frames=0, winStart=performance.now(), fpsNow=0, winWorst=0;
let simSum=0, simMax=0, drawSum=0, drawMax=0, simMs=0, simMsMax=0, drawMs=0, drawMsMax=0, calls=0, tris=0, hidden=0;
document.addEventListener('visibilitychange',()=>{ if(document.hidden) hidden++; });
const f0=v=>v==null?'--':String(Math.round(v));
function statsLine(arr){ const v=arr.map(q=>q.v); return v.length?('avg '+f0(v.reduce((a,b)=>a+b,0)/v.length)+' max '+f0(Math.max(...v))):'--'; }
function diagText(){
  const t=Date.now(), low=fpsHist.length?Math.min(...fpsHist):0, avg=fpsHist.length?fpsHist.reduce((a,b)=>a+b,0)/fpsHist.length:0;
  const echo=N.echo.rtt, conn=N.state==='open'?(N.ended?'ended ('+N.ended+')':N.connected?'live':(N.everConnected?'down':'connecting')):N.state;
  const lines=[
    'LUNABARA NET PROBE '+BUILD,
    'fps now/low/avg: '+fpsNow+' / '+low+' / '+avg.toFixed(1)+' (last '+fpsHist.length+'s)  by second: '+fpsHist.join(' '),
    'startup fps by second: '+startHist.join(' '),
    'worst frame ms (last 10s): '+(worstHist.length?Math.max(...worstHist).toFixed(0):'--'),
    'cpu ms per frame: sim '+simMs.toFixed(2)+' (max '+simMsMax.toFixed(1)+')  draw submit '+drawMs.toFixed(2)+' (max '+drawMsMax.toFixed(1)+')',
    'draw calls: '+calls+'  triangles: '+tris+'  pixel ratio: '+DPR+' (device '+(window.devicePixelRatio||1)+')',
    'buffer: '+renderer.domElement.width+'x'+renderer.domElement.height+'  css: '+vw+'x'+vh+'  viewport: '+window.innerWidth+'x'+window.innerHeight+
      (window.visualViewport?'  visual: '+Math.round(visualViewport.width)+'x'+Math.round(visualViewport.height):'')+'  resizes: '+resizes,
    'standalone: '+((navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'yes':'no')+'  hidden: '+hidden+'x  wake lock: '+wakeLock,
    '--- room',
    'room: '+(N.state==='starting'?'waiting for use()':N.state==='no-runtime'?'no window.claude (not opened from the artifact link)':N.state==='unavailable'?'use("room") gave null after '+f0(N.useMs)+' ms':'ready after '+f0(N.useMs)+' ms'),
    'connection: '+conn+'  first connect after '+f0(N.firstConn)+' ms  drops (over 2 s): '+N.drops+'  blips: '+N.blips+'  down total: '+(N.downMs/1000).toFixed(1)+' s',
    'you: peer '+(N.me.peer||'--')+'  owner '+(N.me.owner==null?'?':N.me.owner?'yes':'no')+'  can edit '+(N.me.canEdit==null?'?':N.me.canEdit?'yes':'no')+
      '  id '+(N.me.id?'yes':'no')+'  name '+(N.me.name?'yes':'no')+'  suit '+SUITS[me.suit].name+'  view '+view,
    'players here: '+(N.peers.size+1)+' (you + '+N.peers.size+')  your other tabs: '+N.myTabs+'  guests: '+N.guests+'  agents: '+N.agents+'  peer updates: '+N.deliveries,
    'sending: presence target '+N.sendHz+'/s, actual '+(N.sentTimes.filter(x=>x>t-2000).length/2).toFixed(1)+'/s, '+N.bytes+' bytes  ok '+N.presOk+(Object.keys(N.presErr).length?'  errors '+JSON.stringify(N.presErr):''),
    'events: ok '+N.emitOk+'  skipped while offline '+N.emitSkipped+(Object.keys(N.emitErr).length?'  errors '+JSON.stringify(N.emitErr):'  errors none')+
      (Object.keys(N.emitBlocked).length?'  blocked: '+Object.keys(N.emitBlocked).join(','):''),
    'echo (your own event back): last '+f0(echo[echo.length-1])+'  median '+f0(pct(echo,0.5))+'  p90 '+f0(pct(echo,0.9))+'  max '+f0(echo.length?Math.max(...echo):null)+' ms  lost '+N.echo.lost+'/'+N.echo.sent,
    'smoothing: '+(N.smooth?N.smooth+' ms behind (interpolation)':'off (raw: drawn at the newest update)')+'  waves sent '+N.acts.sent+' heard '+N.acts.heard+'  jumps '+me.jumps,
  ];
  for(const R of N.peers.values()){
    const md=R.modes, tot=Math.max(1,md.interp+md.extrap+md.hold+md.early+md.raw), pc=v=>Math.round(v/tot*100)+'%';
    const late=R.late.map(q=>q.v);
    lines.push('peer '+displayName(R)+' ('+R.peer.slice(0,6)+(R.guest?', guest':'')+(R.isMe?', your other tab':'')+'): '+
      'updates '+(R.recvs.filter(x=>x>t-2000).length/2).toFixed(1)+'/s  gaps '+statsLine(R.gaps)+' ms  jitter p95 '+f0(pct(late,0.95))+' ms  too late for buffer '+R.tooLate+'/'+R.n+
      '  skipped seq '+R.skipped+'  bad '+R.bad+'  last update '+f0(R.lastRecv?t-R.lastRecv:null)+' ms ago');
    lines.push('  ping median '+f0(pct(R.rtt,0.5))+'  p90 '+f0(pct(R.rtt,0.9))+'  max '+f0(R.rtt.length?Math.max(...R.rtt):null)+' ms  lost '+R.pingLost+'/'+R.pingSent+
      '  drawn: interp '+pc(md.interp)+' extrap '+pc(md.extrap)+' hold '+pc(md.hold)+' early '+pc(md.early)+(md.raw?' raw '+pc(md.raw):'')+
      '  suit '+(R.sk>=0?SUITS[R.sk].name:'--')+(R.fp?' (1P)':'')+'  waves heard '+R.acts+'  here '+Math.round((t-R.joinedAt)/1000)+' s');
  }
  lines.push('3d library: '+(window.__lib||'?')+'  errors: '+errs.n+(errs.ext?'  (plus '+errs.ext+' hidden "Script error." from outside the page)':''));
  errs.list.forEach((x,i)=>lines.push(errLine(x,i+1))); if(errs.last) lines.push(errLine(errs.last,'latest'));
  lines.push('ua: '+navigator.userAgent);
  return lines.join('\n');
}
function setDiag(on){ $('diag').hidden=!on; $('diagShade').hidden=!on; }
function openDiag(){ $('diagText').value=diagText(); $('diagMsg').textContent='Copy this and paste it back to Claude.'; setDiag(true); }
$('readout').onclick=openDiag;
$('readout').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDiag(); } });
$('diagShade').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); setDiag(false); });
$('bClose').onclick=()=>setDiag(false);
const RATES=[10,15,20,30], SMOOTHS=[120,200,0,60];
$('bRate').onclick=()=>{ N.sendHz=RATES[(RATES.indexOf(N.sendHz)+1)%RATES.length]; $('bRate').textContent='Send '+N.sendHz+'/s'; $('diagText').value=diagText(); };
$('bSmooth').onclick=()=>{ N.smooth=SMOOTHS[(SMOOTHS.indexOf(N.smooth)+1)%SMOOTHS.length]; $('bSmooth').textContent=N.smooth?'Smooth '+N.smooth+' ms':'Smooth off';
  for(const R of N.peers.values()){ R.modes={interp:0,extrap:0,hold:0,early:0,raw:0}; R.tooLate=0; R.n=0; } $('diagText').value=diagText(); };
$('bCopy').onclick=()=>{ const ta=$('diagText'); ta.value=diagText();
  const fallback=()=>{ ta.focus(); ta.select(); $('diagMsg').textContent='Selected. Use your phone’s Copy.'; };
  try{ navigator.clipboard.writeText(ta.value).then(()=>{ $('diagMsg').textContent='Copied.'; },fallback); }catch(_){ fallback(); } };

// ================================================================ HUD
function hud(t){
  $('fps').textContent=fpsNow||'--'; $('fpslow').textContent=fpsHist.length?Math.min(...fpsHist):'--';
  $('nplay').textContent=String(N.peers.size+1);
  const live=N.state==='open' && N.connected && !N.ended;
  $('dot').className='dot'+(live?' live':(N.state==='open' && N.everConnected)||N.ended||N.state==='unavailable'?' down':'');
  const bp=bestPing(), em=pct(N.echo.rtt,0.5);
  $('pingLine').innerHTML=bp!=null?'ping <b>'+bp+'</b> ms':em!=null?'echo <b>'+em+'</b> ms':'ping <b>--</b> ms';
  let msg='Joining the co-op room…', warn=false;
  if(N.state==='no-runtime'){ msg='Solo here. Open the artifact link to play together.'; warn=true; }
  else if(N.state==='unavailable'){ msg='Co-op room not available in this view.'; warn=true; }
  else if(N.state==='open'){
    if(N.ended){ msg='Room closed ('+N.ended+').'; warn=true; }
    else if(!N.connected){ if(N.everConnected && N.downAt && t-N.downAt>2000){ msg='Connection lost. Reconnecting…'; warn=true; } else if(!N.everConnected) msg='Connecting…'; else msg=$('status').textContent; }
    else if(!N.peers.size) msg='Alone here. Open this link on a second device.';
    else msg=(N.peers.size+1)+' players on the regolith'+(bp!=null?' · ping '+bp+' ms':'');
  }
  const st=$('status'); st.textContent=msg; st.className=warn?'warn':'';
  const ta=$('diagText'); if(!$('diag').hidden && document.activeElement!==ta){ const sc=ta.scrollTop; ta.value=diagText(); ta.scrollTop=sc; }
  const E=$('err'); if(errs.n){ E.hidden=false; E.textContent=errs.n+' error'+(errs.n>1?'s':'')+' · tap the readout for the Diag'; }
}

// ================================================================ start: compile every suit behind the first frame, then run
{ const proto=[]; for(let i=0;i<SUIT_N;i++){ const c=makeCapy(i); c.root.position.set(0,-50,0); proto.push(c); }
  checkResize(); updateCamera(0);
  try{ renderer.compile(scene,camera); }catch(e){ noteErr(e,'compile'); }
  proto.forEach(dropCapy); }
netStart();
let last=performance.now(), hudT=0, suitT=0, bootSec=0;
function frame(){
  requestAnimationFrame(frame);
  const tp=performance.now(); let dt=(tp-last)/1000; last=tp;
  const ft=dt*1000; if(ft>winWorst) winWorst=ft; frames++;
  if(tp-winStart>=1000){ fpsNow=Math.round(frames*1000/(tp-winStart)); frames=0; winStart=tp;
    pushCap(fpsHist,fpsNow,10); pushCap(worstHist,winWorst,10); winWorst=0; if(bootSec<8){ startHist.push(fpsNow); bootSec++; }
    simMs=simSum/Math.max(1,fpsNow); drawMs=drawSum/Math.max(1,fpsNow); simMsMax=simMax; drawMsMax=drawMax; simSum=drawSum=simMax=drawMax=0; }
  if(dt>0.1) dt=0.1;
  try{
    checkResize();
    const s0=performance.now(), t=Date.now();
    updateLocal(dt,tp);
    netTick(t,me);
    if(t-suitT>1000){ suitT=t; pickSuit(); }
    poseCapy(me.capy,dt,tp/1000,me.x,me.z,me.h,me.yaw,me.spd);
    for(const R of N.peers.values()){
      const P=samplePose(R,t);
      if(!P){ if(R.capy) R.capy.root.visible=false; continue; }
      if(!R.capy || R.capy.si!==R.sk){ const old=R.capy; R.capy=makeCapy(R.sk<0?1:R.sk); if(old){ R.capy.ph=old.ph; R.capy.waveT=old.waveT; dropCapy(old); } if(R.waveQueued){ R.capy.waveT=R.waveQueued; R.waveQueued=0; } }
      R.capy.root.visible=true;
      poseCapy(R.capy,dt,tp/1000,P.x,P.z,P.h,P.y,P.m);
      refreshName(R,t);
    }
    updateCamera(dt);
    beacon.visible=(t%1000)<140;
    camera.updateMatrixWorld();
    for(const R of N.peers.values()) placeTag(R,vw,vh,t);
    if(tp-hudT>250){ hudT=tp; hud(t); for(const R of N.peers.values()) tagText(R,t); }
    const s1=performance.now();
    renderer.render(scene,camera);
    const s2=performance.now();
    calls=renderer.info.render.calls; tris=renderer.info.render.triangles;
    simSum+=s1-s0; drawSum+=s2-s1; if(s1-s0>simMax) simMax=s1-s0; if(s2-s1>drawMax) drawMax=s2-s1;
  }catch(e){ noteErr(e,'frame'); }
}
requestAnimationFrame(frame);
window.__np={N,me,diag:diagText,get view(){ return view; },get camYaw(){ return camYaw; },set camYaw(v){ camYaw=v; },samplePose};
})();
